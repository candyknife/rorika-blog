baseURL = 'https://candyknife.github.io/'
locale = 'zh-cn'
title = 'Rorika'
theme = 'PaperMod'

# PaperMod 主题推荐配置（可选）
[params]
  env = 'production'
  description = '这是我的个人博客'
  keywords = [ 'Blog', 'Portfolio' ]

  # 主页信息
  [params.homeInfoParams]
    Title = '你好，欢迎来到我的博客！'
    Content = '这里记录了我的学习笔记和技术分享。'

  # 社交链接（可选）
  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/candyknife'

  [[params.socialIcons]]
    name = 'email'
    url = 'mailto:rolin.y.luo@qq.com'

# 启用标签和分类
[taxonomies]
  tag = 'tags'
  category = 'categories'

# 菜单
[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 15

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 20

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 30

# 搜索功能需要生成 index.json
[outputs]
  home = ["HTML", "RSS", "JSON"]

[caches]
  [caches.images]
    dir = ':cacheDir/images'
